name: Crypto Sentiment Monitor

on:
  # Запуск при пуше в вашу ветку
  push:
    branches:
      - sentiment-monitor-vokilook
  
  # Запуск по расписанию
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 21 * * *'
  
  # Ручной запуск
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: sentiment-monitor-vokilook  # Явно указываем вашу ветку
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      